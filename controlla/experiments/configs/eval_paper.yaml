# Paper-level evaluation config for Controlla.
#
# Prediction manifests are searched under:
#   ${prediction_root}/{section}/{method}/{split}/seed_{seed}/predictions.csv
# and:
#   ${prediction_root}/{method}/{split}/seed_{seed}/predictions.csv
#
# External baselines are marked missing until their prediction manifests are
# generated or registered.

dataset_root: null
dataset_root_candidates:
  - ../AffectHuman-43K-Grouped
  - ../AffectHuman-43K

manifest_path: experiments/outputs/manifests/affecthuman43k_manifest.csv
split_dir: experiments/outputs/splits/affecthuman43k

splits: [val, test]
seeds: [0, 1, 2]
max_samples_per_split: null

prediction_root: experiments/outputs/predictions
output_root: experiments/outputs/paper
cache_root: experiments/outputs/cache

columns:
  image: image_path
  reference_image: reference_image_path
  generated_image: generated_image_path
  prompt: prompt
  target_emotion: emotion_label
  predicted_emotion: predicted_emotion
  audio: audio_path
  identity: identity_id
  method: method
  seed: seed

paper_tables:
  main_results: true
  cross_dataset_generalization: true
  architecture_comparison: true
  geometry_evaluation: true
  retrieval_evaluation: true
  component_ablations: true
  modality_ablations: true
  traversal_comparison: true
  graph_sensitivity: true

main_methods:
  - styleclip
  - controlnet
  - icedit
  - flux_kontext
  - dreambooth_controlnetpp
  - controlla

cross_dataset_methods:
  - controlnetpp
  - icedit
  - flux_kontext
  - dreambooth_controlnetpp
  - controlla

architecture_methods:
  - sdxl
  - sdxl_controlnetpp
  - controlla

geometry_methods:
  - dreambooth
  - icedit
  - flux_kontext
  - controlla

retrieval_methods:
  - clip_retrieval
  - imagebind_retrieval
  - controlla

component_ablations:
  - contrastive_only
  - metric_no_ot
  - without_emotion_fgw
  - without_identity_gw
  - without_disentanglement_loss
  - without_graph_euclidean
  - controlla

modality_ablations:
  - image_only
  - image_audio
  - image_text
  - image_text_audio

traversal_methods:
  - linear_euclidean
  - spline_interpolation
  - random_path
  - fully_connected_path
  - controlla_geodesic

graph_sensitivity:
  - k_5
  - k_10
  - k_20

cross_dataset_manifests:
  affectnet: experiments/outputs/datasets/affectnet.csv
  celebahq: experiments/outputs/datasets/celebahq.csv

metrics:
  endpoint_accuracy: true
  trajectory_smoothness: true
  identity_similarity: true
  identity_auc: true
  binding_score: true
  latent_disentanglement: true
  geodesic_consistency: true
  retrieval_r_at_k: true
  human_preference: false

retrieval:
  ks: [1, 5]
  modes:
    - image_to_text
    - image_to_audio

encoders:
  clip_model: openai/clip-vit-base-patch32
  clip_local_only: true
  imagebind_local_only: true
  arcface_local_only: true
  device: cuda

missing_predictions:
  behavior: warn
  write_missing_report: true