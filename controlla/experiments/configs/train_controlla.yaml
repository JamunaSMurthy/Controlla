base_config: configs/base.yaml
experiment_name: controlla_paper_train
output_root: experiments/outputs/runs
manifest_path: null
split_dir: ../controlla_dataset_builder/outputs/train_optimized_splits
split_name: train
seeds: [0, 1, 2]
optimizer:
  name: adamw
  learning_rate: 0.0002
  batch_size: 32
  training_iterations: 200000
frozen_encoders: true
backbone:
  name: latent_diffusion
  injection_mode: cross_attention
ot:
  mode: fgw
  epsilon: 0.05
  sinkhorn_iterations: 20
  lambda_e: 1.0
  lambda_i: 1.0